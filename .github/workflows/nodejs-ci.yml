name: Node.js CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: |
          echo "Running npm audit via npm script and failing on high/critical vulnerabilities"
          npm run audit --if-present -- --audit-level=high

      - name: Check for dependency updates (npm-check-updates)
        run: |
          echo "Checking for available dependency updates via npm script"
          npm run check-updates --if-present || true

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Archive build artifact
        run: |
          if [ -d webpack/dist ]; then
            zip -r app-${{ github.run_id }}.zip webpack/dist;
          else
            echo "No dist directory found, skipping artifact archive";
            exit 1;
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: artifact-${{ github.run_id }}
          release_name: Artifact ${{ github.run_id }}
          body: "Build artifact for run ${{ github.run_id }}"
          draft: false
          prerelease: true

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app-${{ github.run_id }}.zip
          asset_name: app-${{ github.run_id }}.zip
          asset_content_type: application/zip

  deploy:
    name: Download artifact and Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup GitHub CLI
        uses: cli/cli@v3

      - name: Download release asset via gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=artifact-${{ github.run_id }}
          echo "Downloading release asset for $TAG"
          # download the matching asset to the workspace
          gh release download "$TAG" --pattern "app-${{ github.run_id }}.zip" || (
            echo "Failed to download release asset via gh" && exit 1
          )

      - name: Deploy to Azure Web App
        if: false
        uses: azure/webapps-deploy@v2
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app-${{ github.run_id }}.zip
