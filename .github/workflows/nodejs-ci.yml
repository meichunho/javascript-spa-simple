name: Node.js CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  NODE_VERSION: '20'

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (fail on high/critical)
        run: |
          echo "Running npm audit via npm script and failing on high/critical vulnerabilities"
          npm run audit --if-present -- --audit-level=high
      - name: Check for dependency updates (npm-check-updates)
        run: |
          echo "Checking for available dependency updates via npm script"
          npm run check-updates --if-present || true
      - name: Lint
        run: npm run lint --if-present

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test --if-present

  build:
    name: Build project
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present

      - name: Archive build artifact
        run: |
          if [ -d webpack/dist ]; then
            zip -r app-${{ github.run_id }}.zip webpack/dist;
          else
            echo "No dist directory found, skipping artifact archive";
            exit 1;
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: app-${{ github.run_id }}.zip
          retention-days: 1

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: artifact-${{ github.run_id }}
          name: Artifact ${{ github.run_id }}
          body: "Build artifact for run ${{ github.run_id }}"
          draft: false
          prerelease: true
          files: app-${{ github.run_id }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Download artifact and Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Download release asset via gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=artifact-${{ github.run_id }}
          echo "Downloading release asset for $TAG"
          # download the matching asset to the workspace
          gh release download "$TAG" --pattern "app-${{ github.run_id }}.zip" || (
            echo "Failed to download release asset via gh" && exit 1
          )

      - name: Deploy to Azure Web App
        if: false
        uses: azure/webapps-deploy@v2
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app-${{ github.run_id }}.zip
